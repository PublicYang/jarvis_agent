[project]
name = "jarvis-agent"
version = "0.1.0"
description = "A Python Agent Runtime built from scratch for learning production-grade Agent evolution"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [{ name = "Jarvis Team" }]
keywords = ["agent", "runtime", "llm", "python"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]

# Phase 3: Runtime domain models; Phase 4: LLM adapter
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff==0.16.5",
    "black>=24.0",
    "pre-commit>=3.0",
]

[project.scripts]
# Phase7: jarvis = "integrations.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "runtime",
    "planner",
    "tools",
    "llm",
    "memory",
    "workflow",
    "integrations",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["runtime", "planner", "tools", "llm", "memory", "workflow", "integrations", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
asyncio_mode = "auto"
